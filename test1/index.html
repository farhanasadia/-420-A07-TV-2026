
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }

        header, footer {
            background: #263b59;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        #count {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #status {
            text-align: center;
            padding: 15px;
        }

        .todo-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .todo-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .todo-card h3 {
            margin: 0;
            font-size: 16px;
        }

        @media (min-width: 768px) {
            .todo-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Todo List</h1>
        <p>My daily tasks</p>
    </header>

    <main>
        <p id="count">Loading task count...</p>

        <p id="status">Loading…</p>

        <section id="todoList" class="todo-container">
        </section>
    </main>

    <footer>
        <p>My Todo App - 2026</p>
    </footer>

    <script>
        async function loadTodos() {
            const status = document.getElementById("status");
            const todoList = document.getElementById("todoList");
            const count = document.getElementById("count");

            status.textContent = "Loading…";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/todos?_limit=12"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch todos");
                }

                const todos = await response.json();

                todoList.innerHTML = "";

                const completed = todos.filter(todo => todo.completed).length;
                count.textContent = `${completed} of ${todos.length} completed`;

                todos.forEach(todo => {
                    const card = document.createElement("div");
                    card.className = "todo-card";

                    const title = document.createElement("h3");
                    title.textContent = todo.title;

                    const statusText = document.createElement("p");
                    statusText.textContent = todo.completed
                        ? "✅ Completed"
                        : "⬜ Not completed";

                    card.appendChild(title);
                    card.appendChild(statusText);
                    todoList.appendChild(card);
                });

                status.textContent = "";

            } catch (error) {
                count.textContent = "";
                todoList.innerHTML = "";
                status.textContent =
                    "Sorry, we couldn't load your tasks. Please check your internet connection and try again.";
            }
        }

        loadTodos();
    </script>

</body>
</html>
